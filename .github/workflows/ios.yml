name: iOS Starter Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-14  # Latest macOS to support latest Xcode

    steps:
      - name: Set up Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default > default
          echo "Using default scheme: $default"

      - name: Build
        run: |
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//")
          scheme=$(cat default)

          if ls -A | grep -iq '\.xcworkspace$'; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i '\.xcworkspace$')
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i '\.xcodeproj$')
          fi
          file_to_build=$(echo $file_to_build | awk '{$1=$1;print}')
          echo "Building $file_to_build with scheme $scheme"

          xcodebuild build-for-testing \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "platform=iOS Simulator,name=$device"

      - name: Test
        run: |
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//")
          scheme=$(cat default)

          if ls -A | grep -iq '\.xcworkspace$'; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i '\.xcworkspace$')
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i '\.xcodeproj$')
          fi
          file_to_build=$(echo $file_to_build | awk '{$1=$1;print}')
          echo "Testing $file_to_build with scheme $scheme"

          xcodebuild test-without-building \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "platform=iOS Simulator,name=$device"
