name: iOS Starter Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test on iPad Simulator
    runs-on: macos-14

    steps:
      - name: Set up Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Default Scheme
        id: detect-scheme
        run: |
          scheme_list=$(xcodebuild -list -json)
          default_scheme=$(echo "$scheme_list" | ruby -e "require 'json'; puts JSON.parse(STDIN.read)['project']['targets'][0]")
          echo "Detected scheme: $default_scheme"
          echo "scheme=$default_scheme" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          scheme="${{ steps.detect-scheme.outputs.scheme }}"
          filetype_parameter="project"
          file_to_build=$(ls -A | grep -i '\.xcodeproj$')

          echo "Building $file_to_build with scheme $scheme"
          xcodebuild build-for-testing \
            -scheme "$scheme" \
            -project "$file_to_build" \
            -destination 'platform=iOS Simulator,name=iPad (10th generation),OS=17.4'

      - name: Test
        run: |
          scheme="${{ steps.detect-scheme.outputs.scheme }}"
          file_to_build=$(ls -A | grep -i '\.xcodeproj$')

          echo "Testing $file_to_build with scheme $scheme"
          xcodebuild test-without-building \
            -scheme "$scheme" \
            -project "$file_to_build" \
            -destination 'platform=iOS Simulator,name=iPad (10th generation),OS=17.4'
